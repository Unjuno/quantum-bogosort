name: one-shot branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  delete-merged-agent-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete merged and superseded agent branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            'agent/fix-markdown-repro-audit'
            'agent/post-merge-status-cleanup'
            'agent/post-v0.2-adaptive-alignment-theorem'
            'agent/post-v0.2-calibration-certificate'
            'agent/post-v0.2-confidence-envelope-certificate'
            'agent/post-v0.2-explained-variance-certificate'
            'agent/post-v0.2-finite-sample-certificate'
            'agent/post-v0.2-light-tail-certificate'
            'agent/post-v0.2-residual-covariance-extension'
            'agent/post-v0.2-residual-variance-certificate'
            'agent/post-v0.2-robust-mom-certificate'
            'agent/post-v0.2-selection-validity'
            'agent/public-prose-audit-cleanup'
            'agent/remove-public-meta'
            'agent/repository-navigation-cleanup'
            'agent/research-map-paper-scaffold'
            'agent/v0.1-public-review'
            'agent/v0.2-bridge-falsifiability'
            'agent/v0.2-figures-proof-ci'
            'agent/v0.2-manuscript-layout'
            'agent/v0.2-recognition-time-roadmap'
            'agent/v0.2-release-audit'
            'agent/v0.3-public-review-cleanup'
          )

          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done

          for branch in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "::error::Branch still exists: ${branch}"
              exit 1
            fi
          done

          echo "Deleted ${#branches[@]} merged/superseded agent branches."
