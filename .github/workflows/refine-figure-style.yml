name: one-shot figure style refinement

on:
  push:
    branches:
      - agent/figure-reproducibility-qa
    paths:
      - .github/workflows/refine-figure-style.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/figure-reproducibility-qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refine monochrome line styles
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('figures/generate_figures.py')
          text = path.read_text(encoding='utf-8')
          old = '.s3{fill:none;stroke:#888;stroke-width:2.2;stroke-dasharray:2 4}.bar'
          new = '.s3{fill:none;stroke:#888;stroke-width:2.2;stroke-dasharray:2 4}.s4{fill:none;stroke:#111;stroke-width:2.2;stroke-dasharray:12 4 2 4}.bar'
          if old not in text:
              raise SystemExit('Expected style token not found')
          text = text.replace(old, new, 1)
          old_series = '("Total FP effect", d.total_FP_effect.to_numpy(), "s1")'
          new_series = '("Total FP effect", d.total_FP_effect.to_numpy(), "s4")'
          if old_series not in text:
              raise SystemExit('Expected Figure 5 series token not found')
          text = text.replace(old_series, new_series, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regenerate SVGs
        run: python figures/generate_figures.py
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/generate_figures.py figures/generated/ data/processed/fig2_fosd_theorem_illustration.csv
          git commit -m "Improve monochrome figure readability"
          git push origin HEAD:agent/figure-reproducibility-qa
