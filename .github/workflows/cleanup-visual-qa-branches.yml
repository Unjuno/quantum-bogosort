name: one-shot visual QA branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-visual-qa-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged visual QA branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            agent/pre-announcement-visual-qa \
            agent/figure-reproducibility-qa
          do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
