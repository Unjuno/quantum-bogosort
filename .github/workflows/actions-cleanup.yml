name: one-shot actions cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/actions-cleanup.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel stale PR validation run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/32154770506/force-cancel"
