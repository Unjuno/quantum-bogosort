name: migrate frozen snapshots to tags and releases

on:
  push:
    paths:
      - '.github/workflows/migrate_release_snapshots.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create immutable snapshot tags and GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          ensure_tag() {
            tag="$1"
            sha="$2"
            if current=$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
              if [ "$current" != "$sha" ]; then
                gh api -X PATCH "repos/$repo/git/refs/tags/$tag" -f sha="$sha" -F force=true >/dev/null
              fi
            else
              gh api -X POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            fi
          }

          ensure_release() {
            tag="$1"
            title="$2"
            notes="$3"
            if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$repo" --verify-tag --title "$title" --notes "$notes"
            fi
          }

          ensure_tag "v0.2-public-review" "7405f7408f74fa32b16d1cc9f624070cc14624ab"
          ensure_tag "v0.3-public-review" "58038763127258bd3e2f0d41708c4dfa01f81fd6"

          ensure_release "v0.2-public-review" "v0.2 Public Review" "Frozen QBS v0.2 public-review snapshot. Historical scientific snapshot; current work continues on main."
          ensure_release "v0.3-public-review" "v0.3 Public Review" "Frozen QBS v0.3 public-review snapshot containing the locked T1–T5 / E1–E5 core and the integrated S2 line. Current review and visualization work continues on main."

      - name: Remove obsolete snapshot branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          for ref in \
            "heads/release/v0.2-public-review" \
            "heads/release/v0.3-public-review"
          do
            if gh api "repos/$repo/git/ref/$ref" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$repo/git/refs/$ref"
            fi
          done
