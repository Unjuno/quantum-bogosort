name: validate

on:
  push:
  pull_request:

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile experiment, figure, and validation scripts
        run: python -m py_compile experiments/*.py figures/*.py scripts/*.py
      - name: Enforce GitHub Markdown math delimiters
        run: python scripts/validate_markdown_math.py
      - name: Validate research repository structure
        run: python scripts/validate_repository_structure.py
      - name: Run reproduction scripts
        run: |
          python experiments/exp1_fosd_and_stress.py
          python experiments/exp2_minimal_agent.py
          python experiments/exp3_recognition_decomposition.py
          python experiments/exp4_interaction.py
          python experiments/exp5_branch_map.py
      - name: Regenerate publication figures
        run: |
          python figures/generate_figures.py
          python figures/generate_pdf_figures.py
      - name: Check figure outputs
        run: |
          test -s figures/generated/fig1_framework.svg
          test -s figures/generated/fig2_fosd.svg
          test -s figures/generated/fig3_recognition_decomposition.svg
          test -s figures/generated/fig4_interaction_sign.svg
          test -s figures/generated/fig5_adaptation_quality.svg
          test -s figures/generated/fig6_branch_coherence.svg
          test -s figures/generated_pdf/fig1_framework.pdf
          test -s figures/generated_pdf/fig2_fosd.pdf
          test -s figures/generated_pdf/fig3_recognition_decomposition.pdf
          test -s figures/generated_pdf/fig4_interaction_sign.pdf
          test -s figures/generated_pdf/fig5_adaptation_quality.pdf
          test -s figures/generated_pdf/fig6_branch_coherence.pdf
      - name: Validate manifest references
        run: python scripts/validate_manifest.py

  manuscript-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Generate manuscript figure PDFs
        run: python figures/generate_pdf_figures.py
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Build manuscript PDF
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Verify manuscript PDF
        run: test -s paper/main.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: qbs-manuscript-pdf
          path: paper/main.pdf
