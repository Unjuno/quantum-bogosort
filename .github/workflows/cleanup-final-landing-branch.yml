name: one-shot final landing branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-final-landing-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged final landing QA branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/final-landing-copy-qa"
