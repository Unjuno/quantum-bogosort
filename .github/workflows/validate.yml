name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - name: Install pinned Python dependencies
        run: pip install -r requirements.txt
      - name: Validate runtime and workflow contract
        run: python scripts/validate_runtime_contract.py
      - name: Compile experiment, figure, and validation scripts
        run: python -m py_compile experiments/*.py figures/*.py scripts/*.py
      - name: Enforce GitHub Markdown math delimiters
        run: python scripts/validate_markdown_math.py
      - name: Validate research repository structure
        run: python scripts/validate_repository_structure.py
      - name: Validate citation metadata
        run: python scripts/validate_citation_metadata.py
      - name: Validate bibliography metadata
        run: python scripts/validate_bibliography_metadata.py
      - name: Validate GitHub issue-template front matter
        run: python scripts/validate_issue_templates.py
      - name: Validate experiment manifest
        run: python scripts/validate_manifest.py
      - name: Validate repository-relative Markdown links
        run: python scripts/validate_markdown_links.py
      - name: Validate Markdown GFM structure through GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_github_markdown_render.py
      - name: Run reproduction scripts and scientific invariants
        run: |
          python experiments/exp1_fosd_and_stress.py
          python experiments/exp2_minimal_agent.py
          python experiments/exp3_recognition_decomposition.py
          python experiments/exp4_interaction.py
          python experiments/exp5_branch_map.py
      - name: Verify manifest-declared reproduction outputs
        run: python scripts/validate_reproduction_outputs.py
      - name: Regenerate repository figures
        run: |
          python figures/generate_figures.py
          python figures/generate_pdf_figures.py
      - name: Check figure outputs
        run: |
          test -s figures/generated/fig1_framework.svg
          test -s figures/generated/fig2_fosd.svg
          test -s figures/generated/fig3_recognition_decomposition.svg
          test -s figures/generated/fig4_interaction_sign.svg
          test -s figures/generated/fig5_adaptation_quality.svg
          test -s figures/generated/fig6_branch_coherence.svg
          test -s figures/generated/fig7_predictive_alignment.svg
          test -s figures/generated_pdf/fig1_framework.pdf
          test -s figures/generated_pdf/fig2_fosd.pdf
          test -s figures/generated_pdf/fig3_recognition_decomposition.pdf
          test -s figures/generated_pdf/fig4_interaction_sign.pdf
          test -s figures/generated_pdf/fig5_adaptation_quality.pdf
          test -s figures/generated_pdf/fig6_branch_coherence.pdf
      - name: Validate exact public figure set
        run: python scripts/validate_figure_set.py
      - name: Validate committed SVG browser structure
        run: python scripts/validate_svg_sources.py
      - name: Verify committed SVG and theorem-illustration reproducibility
        run: |
          git diff --exit-code -- \
            figures/generated/ \
            data/processed/fig2_fosd_theorem_illustration.csv
          git diff --exit-code

  manuscript-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - name: Install pinned Python dependencies
        run: pip install -r requirements.txt
      - name: Validate runtime and workflow contract
        run: python scripts/validate_runtime_contract.py
      - name: Generate manuscript figure PDFs
        run: python figures/generate_pdf_figures.py
      - name: Validate LaTeX render dependencies
        run: python scripts/validate_latex_sources.py
      - name: Install LaTeX toolchain
        run: |
          cat > /tmp/qbs-ubuntu.list <<'EOF'
          deb https://archive.ubuntu.com/ubuntu noble main universe
          deb https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb https://security.ubuntu.com/ubuntu noble-security main universe
          EOF
          APT_OPTS=(
            -o Dir::Etc::sourcelist=/tmp/qbs-ubuntu.list
            -o Dir::Etc::sourceparts=-
            -o APT::Get::List-Cleanup=0
            -o Acquire::Retries=2
            -o Acquire::https::Timeout=30
          )
          timeout 5m sudo apt-get "${APT_OPTS[@]}" update
          timeout 10m sudo apt-get "${APT_OPTS[@]}" install -y \
            latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Build manuscript PDF
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Verify manuscript PDF
        run: test -s paper/main.pdf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qbs-manuscript-pdf
          path: paper/main.pdf
